<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お薦めな食べ物</title>
  <script>
    function updateClock() {
      var now = new Date();
      var hours = now.getHours();
      var minutes = now.getMinutes();
      var seconds = now.getSeconds();
      
      if (hours < 10) hours = '0' + hours;
      if (minutes < 10) minutes = '0' + minutes;
      if (seconds < 10) seconds = '0' + seconds;
      
      var timeString = hours + ':' + minutes + ':' + seconds;
      document.getElementById('clock').innerHTML = timeString;
    }
    
    setInterval(updateClock, 1000);
    window.onload = updateClock;
  </script>
</head>
<body>
  <h1>現在時刻</h1>
  <div id="clock" style="font-size: 48px; font-weight: bold; color: blue;">
    00:00:00
  </div>

  <h1>Webシステム構築基礎 第2回課題</h1>
  <p>皆川駿斗(AAA25027)</p>
  <img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6fac6?w=400" width="400" alt="リンゴの写真">
  <h2>お薦めな食べ物：リンゴ</h2>
  <p>私がおすすめする食べ物は「リンゴ」です。その理由は以下の通りです。</p>
  
  <ul>
    <li>洗うだけで手軽に食べられる</li>
    <li>ビタミンが豊富で健康に良い</li>
    <li>日持ちするので一人暮らしの大学生にぴったり</li>
  </ul>
  
  <p>忙しい朝の朝食や、勉強中の間食として最適です。</p>

  <br>

</body>
</html>
